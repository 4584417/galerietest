<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Carousel</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  .carousel {
    width: 100%;              /* Full width of container */
    max-width: 800px;         /* Optional max width */
    margin: 50px auto;        /* Center carousel */
    overflow: hidden;
    border: 2px solid #ccc;   /* Optional border */
    border-radius: 10px;
  }

  .slides {
    display: flex;
    transition: transform 0.5s ease-in-out;
  }

  .slides img {
    width: 100%;          /* Fill width of container */
    height: auto;         /* Keep aspect ratio */
    object-fit: contain;  /* Show full image without cropping */
    flex-shrink: 0;       /* Prevent shrinking inside flex */
  }

  /* Optional navigation buttons */
  button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    font-size: 18px;
    border-radius: 5px;
  }
  .prev { left: 10px; }
  .next { right: 10px; }
</style>
</head>
<body>

<div class="carousel" id="carousel">
  <div class="slides" id="slides">
    <img src="https://img.freepik.com/free-vector/simple-vibing-cat-square-meme_742173-4493.jpg?semt=ais_incoming&w=740&q=80/800/400?1" alt="Slide 1">
    <img src="https://misterpalindrome.wordpress.com/wp-content/uploads/2013/04/mr-palindrome-tons-o-snot.png/800/400?2" alt="Slide 2">
    <img src="https://picsum.photos/800/400?3" alt="Slide 3">
   
  </div>

  <button class="prev" onclick="moveSlide(-1)">❮</button>
  <button class="next" onclick="moveSlide(1)">❯</button>
</div>

<script>
let index = 0;

function moveSlide(step) {
  const slides = document.getElementById('slides');
  const total = slides.children.length;
  index = (index + step + total) % total;
  slides.style.transform = `translateX(-${index * 100}%)`;
}

// Optional: autoplay every 3 seconds
setInterval(() => moveSlide(1), 3000);
</script>

</body>
</html>
